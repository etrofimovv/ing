# Реестр моделей. Пути относительно ING_ROOT (см. .env) или корня пакета.
#
# В пакете ОДНА модель — F19, последний чемпион по грамматическому
# согласованию классов.
#
# ВАЖНО: адаптер работает ТОЛЬКО со своим токенизатором
# (nllb-200-rus-inh-v6, vocab 27381). Движок делает fail-fast сверку
# len(tokenizer) vs embed_tokens — несовпадение даёт ошибку, а не мусор.

models:
  f19_final:
    label: "F19 — RU↔INH, согласование классов б/д/в/й"
    type: lora
    path: "models/v19-case-fixed/final"
    base_model_path: "models/v10-v6base-fixed"
    tokenizer_path: "tokenizers/nllb-200-rus-inh-v6"
    notes: >
      NLLB-200 3.3B + LoRA r16, контрастивный лосс по грамматическому классу.
      Замер 06.08.2026 (dev 400 пар): BLEU 10.10, chrF++ 34.40.
      Точность класса (held-out, 200 проб, 40 существительных, macro): 56.1%.
      По классам: б 30.5% | д 38.6% | в 100% | й 55.4%. Связка 134/160.
      Согласует и префикс прилагательного, и связку:
      «У него большой камень» -> «боккха кхера ба цун».
