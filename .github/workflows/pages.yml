name: Deploy site to Pages

# Legacy-сборка Pages в этом репозитории встала в состояние errored:
# деплой висел по 10 минут и падал, страница застряла на старой версии.
# Явный workflow заменяет её и деплоит статику напрямую.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Новый пуш отменяет предыдущий запуск, но НЕ уже идущий деплой,
# иначе частые обновления адреса туннеля срывают публикацию.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
